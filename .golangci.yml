# golangci-lint configuration
run:
  # 启用并发
  concurrency: 4
  # 超时时间
  timeout: 30s
  # Go版本
  go: "1.25"
  # 排除目录
  exclude-dirs:
    - vendor
    - mocks

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - dupl
    - goconst
    - gocritic
    - gofmt
    - goimports
    - misspell

linters-settings:
  errcheck:
    # 检查所有错误
    check-type-assertions: true
    check-blank: true
  gocyclo:
    # 函数复杂度阈值
    min-complexity: 15
  dupl:
    # 代码重复阈值
    threshold: 100
  gocritic:
    # 启用的规则
    enabled-checks:
      - boolExprSimplify
      - builtinShadow
      - commentedOutCode
      - commentedOutImport
      - docStub
      - emptyDecl
      - emptyFallthrough
      - emptyStringTest
      - equalFold
      - evalOrder
      - hexLiteral
      - indexAlloc
      - initClause
      - methodExprCall
      - nilValReturn
      - octalLiteral
      - rangeExprCopy
      - rangeValCopy
      - stringXbytes
      - typeAssertChain
      - unlabelStmt
      - weakCond
  goimports:
    # 导入排序
    local-prefixes: github.com/RichardKnop/machinery

issues:
  # 排除的规则
  exclude:
    # 排除测试文件中的某些规则
    - "unused"
  # 排除目录
  exclude-dirs:
    - vendor
    - mocks
  # 排除文件
  exclude-files:
    - "_test.go"

  # 最大问题数
  max-issues-per-linter: 0
  max-same-issues: 0